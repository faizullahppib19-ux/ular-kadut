<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Ular</title>
    
    <!-- TAG WAJIB UNTUK APLIKASI (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background-color: #87CEEB;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none; position: fixed;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #ui-container {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 10; pointer-events: none;
        }

        #score-board {
            font-size: 18px; font-weight: 800; 
            color: #2c3e50; background: rgba(255,255,255,0.8);
            padding: 8px 15px; border-radius: 12px; 
            border: 2px solid #3498db;
            backdrop-filter: blur(5px); pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #btn-pause-toggle {
            font-size: 18px; font-weight: bold; color: #2c3e50; background: rgba(255,255,255,0.8);
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid #3498db;
            display: none; justify-content: center; align-items: center; 
            cursor: pointer; pointer-events: auto; transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #btn-pause-toggle:active { transform: scale(0.9); background: rgba(255,255,255,1); }

        #overlay, #pause-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; 
            color: #2c3e50; z-index: 20;
            backdrop-filter: blur(10px); padding: 20px; box-sizing: border-box;
        }

        #overlay { background: rgba(240, 245, 250, 0.95); }
        #pause-menu { background: rgba(240, 245, 250, 0.85); display: none; z-index: 25; }

        h1 {
            font-size: 36px; margin: 0 0 5px 0; 
            color: #3498db; text-align: center;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.1);
            letter-spacing: 1px; font-weight: 900;
        }
        p { text-align: center; font-size: 14px; color: #555; margin-bottom: 15px; font-weight: 600; }

        .slider-container { width: 100%; max-width: 280px; margin: 10px 0; text-align: center; }
        input[type=range] { width: 100%; -webkit-appearance: none; background: #ddd; height: 10px; border-radius: 10px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #3498db; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin-top: -7px; border: 2px solid white; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 10px; cursor: pointer; background: #bdc3c7; border-radius: 10px; }
        #speed-label { margin-top: 5px; font-size: 14px; color: #2c3e50; font-weight: bold; }

        .mode-container {
            display: flex; gap: 10px; margin: 15px 0;
            background: #fff; padding: 5px; border-radius: 50px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .mode-btn {
            padding: 10px 20px; border: none; border-radius: 40px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            transition: all 0.2s; background: transparent; color: #95a5a6;
        }
        .mode-btn.active {
            background: #3498db; color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        .btn-main {
            padding: 12px 35px; font-size: 16px; background: #3498db; color: white;
            border: none; border-radius: 50px; cursor: pointer; font-weight: 700;
            box-shadow: 0 4px 0 #2980b9; margin-top: 15px; width: 100%; max-width: 250px;
            transition: all 0.1s;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 0 0 #2980b9; }

        .btn-outline {
            padding: 10px 30px; font-size: 14px; background: transparent; color: #3498db;
            border: 2px solid #3498db; border-radius: 50px; cursor: pointer; font-weight: bold;
            margin-top: 10px; width: 100%; max-width: 200px;
        }

        .d-pad { display: none !important; }
        @media (max-width: 768px) {
            .d-pad {
                display: grid !important; position: absolute; bottom: 40px; left: 50%;
                transform: translateX(-50%); grid-template-columns: 65px 65px 65px;
                grid-template-rows: 60px 60px; gap: 8px; z-index: 15; opacity: 0.8;
            }
            .d-pad.hidden { display: none !important; }
        }

        .d-btn {
            background: rgba(44, 62, 80, 0.2); border: 2px solid rgba(44, 62, 80, 0.3);
            border-radius: 15px; color: #2c3e50; font-size: 24px; display: flex;
            justify-content: center; align-items: center; touch-action: manipulation;
            cursor: pointer; user-select: none;
        }
        .d-btn:active { background: rgba(52, 152, 219, 0.5); border-color: #3498db; color: white; }
        
        .btn-up { grid-column: 2; grid-row: 1; } .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; } .btn-right { grid-column: 3; grid-row: 2; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="score-board">SCORE: 0</div>
        <div id="btn-pause-toggle" onclick="togglePause()">||</div>
    </div>

    <div id="overlay">
        <h1>SNAKE SENZIA</h1>
        
        <div style="font-size:12px; font-weight:bold; color:#555;">PILIH MODE:</div>
        <div class="mode-container">
            <button class="mode-btn active" id="mode-wall" onclick="selectMode('wall')">wall</button>
            <button class="mode-btn" id="mode-wrap" onclick="selectMode('wrap')">wrap</button>
        </div>

        <div class="slider-container">
            <div style="margin-bottom:8px; color:#555; font-size:12px; font-weight: bold;">KECEPATAN:</div>
            <input type="range" min="1" max="7" value="3" id="speed-slider" oninput="updateSpeedLabel()">
            <div id="speed-label">Level 3: Normal</div>
        </div>
        <button class="btn-main" onclick="startGame()">MAIN SEKARANG</button>
    </div>

    <div id="pause-menu">
        <h1>PAUSED</h1>
        <button class="btn-main" onclick="togglePause()">LANJUT</button>
        <button class="btn-outline" onclick="quitGame()">KELUAR</button>
    </div>

    <div class="d-pad hidden" id="game-controls">
        <div class="d-btn btn-up" id="btn-up">▲</div>
        <div class="d-btn btn-left" id="btn-left">◀</div>
        <div class="d-btn btn-down" id="btn-down">▼</div>
        <div class="d-btn btn-right" id="btn-right">▶</div>
    </div>

    <script>
        // DAFTARKAN SERVICE WORKER UNTUK APLIKASI
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Terdaftar! Game bisa dimainkan offline."))
            .catch(err => console.log("Service Worker gagal: ", err));
        }

        const SPEEDS = [400, 300, 200, 150, 100, 70, 40];
        const SPEED_NAMES = ["Snail", "Slow", "Normal", "Fast", "Super", "Hyper", "God"];
        const GRID_SIZE = 15;
        const LIMIT = Math.floor(GRID_SIZE / 2);
        
        let scene, camera, renderer;
        let snakeMesh = [], snakeData = [];
        let foodMesh, foodData = {x: 0, z: 0};
        let direction = {x: 0, z: -1}, nextDirection = {x: 0, z: -1};
        let gameInterval, isRunning = false, isPaused = false;
        let score = 0, currentSpeedDelay = 200;
        let headMaterial, bodyMaterial, foodMaterial, wallGroup;
        let currentMode = 'wall';

        function selectMode(mode) {
            currentMode = mode;
            document.getElementById('mode-wall').classList.remove('active');
            document.getElementById('mode-wrap').classList.remove('active');
            document.getElementById('mode-' + mode).classList.add('active');
        }

        function updateSpeedLabel() {
            const val = document.getElementById('speed-slider').value;
            document.getElementById('speed-label').innerText = `Level ${val}: ${SPEED_NAMES[val-1]}`;
            currentSpeedDelay = SPEEDS[val-1];
        }

        function createHeadTexture() {
            const c = document.createElement('canvas'); c.width=128; c.height=128;
            const x = c.getContext('2d');
            x.fillStyle='#2ecc71'; x.fillRect(0,0,128,128);
            x.fillStyle='white'; x.beginPath(); x.arc(35,40,18,0,7); x.arc(93,40,18,0,7); x.fill();
            x.fillStyle='#2c3e50'; x.beginPath(); x.arc(35,40,8,0,7); x.arc(93,40,8,0,7); x.fill();
            x.fillStyle='#ff7979'; x.fillRect(58,80,12,30);
            x.beginPath(); x.moveTo(58,110); x.lineTo(64,100); x.lineTo(70,110); x.fill();
            return new THREE.CanvasTexture(c);
        }

        function adjustCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1.0) camera.position.set(0, 30, 25); 
            else camera.position.set(0, 22, 16); 
            camera.lookAt(0, 0, 0);
        }

        function init() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0xb0e0e6); 
            scene.fog = new THREE.Fog(0xb0e0e6, 20, 60);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
            adjustCamera();

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            scene.add(new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0xbdc3c7, 0xecf0f1));
            const planeMat = new THREE.MeshStandardMaterial({ color: 0xf0e68c, roughness: 0.9, metalness: 0.0 });
            const p = new THREE.Mesh(new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE), planeMat);
            p.rotation.x = -Math.PI/2; p.receiveShadow = true; scene.add(p);

            createWalls();

            const ht = createHeadTexture(); ht.center.set(0.5,0.5); ht.rotation = -Math.PI/2;
            const snakeBaseMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.8, metalness: 0.1 });
            headMaterial = [snakeBaseMat, snakeBaseMat, new THREE.MeshStandardMaterial({map: ht, roughness: 0.8}), snakeBaseMat, snakeBaseMat, snakeBaseMat];
            bodyMaterial = snakeBaseMat;
            foodMaterial = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.7 });

            foodMesh = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32), foodMaterial);
            foodMesh.castShadow = true; scene.add(foodMesh);

            setupMobileControls(); animate();
        }

        function createWalls() {
            wallGroup = new THREE.Group();
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6, roughness: 0.5 });
            const size = GRID_SIZE + 1; const thick = 0.5; const height = 1;

            const w1 = new THREE.Mesh(new THREE.BoxGeometry(size, height, thick), wallMat);
            w1.position.set(0, 0.5, -(GRID_SIZE/2) - 0.25); w1.castShadow=true; wallGroup.add(w1);
            const w2 = new THREE.Mesh(new THREE.BoxGeometry(size, height, thick), wallMat);
            w2.position.set(0, 0.5, (GRID_SIZE/2) + 0.25); w2.castShadow=true; wallGroup.add(w2);
            const w3 = new THREE.Mesh(new THREE.BoxGeometry(thick, height, size), wallMat);
            w3.position.set(-(GRID_SIZE/2) - 0.25, 0.5, 0); w3.castShadow=true; wallGroup.add(w3);
            const w4 = new THREE.Mesh(new THREE.BoxGeometry(thick, height, size), wallMat);
            w4.position.set((GRID_SIZE/2) + 0.25, 0.5, 0); w4.castShadow=true; wallGroup.add(w4);
            scene.add(wallGroup);
        }

        function startGame() {
            currentSpeedDelay = SPEEDS[document.getElementById('speed-slider').value-1];
            if(gameInterval) clearInterval(gameInterval);
            
            snakeData = [{x: 0, z: 2}, {x: 0, z: 3}, {x: 0, z: 4}];
            direction = {x: 0, z: -1}; nextDirection = {x: 0, z: -1};
            score = 0; document.getElementById('score-board').innerText = "SCORE: 0";
            
            snakeMesh.forEach(m => scene.remove(m)); snakeMesh = [];
            snakeData.forEach((p, i) => addSegment(p.x, p.z, i===0));
            spawnFood();
            
            wallGroup.visible = (currentMode === 'wall');

            document.getElementById('overlay').style.display = 'none';
            document.getElementById('pause-menu').style.display = 'none';
            document.getElementById('btn-pause-toggle').style.display = 'flex';
            document.getElementById('game-controls').classList.remove('hidden'); 
            
            isRunning = true; isPaused = false;
            gameInterval = setInterval(gameLoop, currentSpeedDelay);
        }

        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                clearInterval(gameInterval);
                document.getElementById('pause-menu').style.display = 'flex';
                document.getElementById('game-controls').classList.add('hidden');
            } else {
                gameInterval = setInterval(gameLoop, currentSpeedDelay);
                document.getElementById('pause-menu').style.display = 'none';
                document.getElementById('game-controls').classList.remove('hidden');
            }
        }

        function quitGame() { document.getElementById('pause-menu').style.display = 'none'; gameOver(); }

        function addSegment(x, z, h) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.92, 0.92), h ? headMaterial : bodyMaterial);
            m.position.set(x, 0.5, z); m.castShadow = true; m.receiveShadow = true;
            if(h) {
                if(direction.x===1) m.rotation.y = -Math.PI/2; else if(direction.x===-1) m.rotation.y = Math.PI/2;
                else if(direction.z===1) m.rotation.y = Math.PI; else if(direction.z===-1) m.rotation.y = 0;
            }
            scene.add(m); snakeMesh.push(m);
        }

        function gameLoop() {
            direction = nextDirection;
            let nextX = snakeData[0].x + direction.x;
            let nextZ = snakeData[0].z + direction.z;
            let wallCrash = false;

            if (currentMode === 'wall') {
                if (Math.abs(nextX) > LIMIT || Math.abs(nextZ) > LIMIT) wallCrash = true;
            } else {
                if (nextX > LIMIT) nextX = -LIMIT; else if (nextX < -LIMIT) nextX = LIMIT;
                if (nextZ > LIMIT) nextZ = -LIMIT; else if (nextZ < -LIMIT) nextZ = LIMIT;
            }

            const nh = {x: nextX, z: nextZ};
            if(wallCrash || snakeData.some(s => s.x===nh.x && s.z===nh.z)) { gameOver(); return; }

            snakeData.unshift(nh);
            if(snakeMesh.length > 0) { snakeMesh[snakeMesh.length-1].material = bodyMaterial; snakeMesh[snakeMesh.length-1].rotation.set(0,0,0); }
            addSegment(nh.x, nh.z, true);

            if(nh.x === foodData.x && nh.z === foodData.z) {
                score++; document.getElementById('score-board').innerText = "SCORE: " + score; spawnFood();
            } else {
                const t = snakeMesh.shift(); scene.remove(t); t.geometry.dispose(); snakeData.pop();
            }
        }

        function spawnFood() {
            let v=false;
            while(!v) { 
                foodData={x:Math.floor(Math.random()*GRID_SIZE)-LIMIT, z:Math.floor(Math.random()*GRID_SIZE)-LIMIT}; 
                v=!snakeData.some(s => s.x===foodData.x && s.z===foodData.z); 
            }
            foodMesh.position.set(foodData.x, 0.5, foodData.z);
        }

        function gameOver() {
            isRunning = false; isPaused = false; clearInterval(gameInterval);
            document.querySelector('#overlay h1').innerText = "GAME OVER";
            document.querySelector('.btn-main').innerText = "MAIN LAGI";
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('game-controls').classList.add('hidden');
            document.getElementById('btn-pause-toggle').style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);
            if(foodMesh) { foodMesh.rotation.y += 0.02; foodMesh.position.y = 0.5 + Math.sin(Date.now()*0.003)*0.15; }
            renderer.render(scene, camera);
        }

        function setDir(x, z) {
            if(!isRunning || isPaused) return;
            if(x!==0 && direction.x!==-x) nextDirection={x:x, z:0};
            if(z!==0 && direction.z!==-z) nextDirection={x:0, z:z};
        }

        document.addEventListener('keydown', e => {
            if(e.code==="Space" || e.code==="Escape") { togglePause(); return; }
            if(e.key==="ArrowUp") setDir(0, -1); else if(e.key==="ArrowDown") setDir(0, 1);
            else if(e.key==="ArrowLeft") setDir(-1, 0); else if(e.key==="ArrowRight") setDir(1, 0);
        });

        function setupMobileControls() {
            const th = (id, x, z) => {
                const b = document.getElementById(id);
                b.addEventListener('touchstart', e => { e.preventDefault(); setDir(x, z); b.style.background="rgba(52, 152, 219, 0.5)"; b.style.color="white"; }, {passive:false});
                b.addEventListener('touchend', e => { e.preventDefault(); b.style.background="rgba(44, 62, 80, 0.2)"; b.style.color="#2c3e50"; });
            };
            th('btn-up',0,-1); th('btn-down',0,1); th('btn-left',-1,0); th('btn-right',1,0);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); adjustCamera();
        });

        init(); updateSpeedLabel();
    </script>
</body>
</html>
